services:
  # ========================================================
  # Sentinel SafetyAI Backend (FastAPI + Python ML)
  # ========================================================
  - type: web
    name: sentinel-safety-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
